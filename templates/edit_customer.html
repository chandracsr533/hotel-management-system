{% extends 'dashboard_layout.html' %}

{% block title %}Edit Customer{% endblock %}

{% block admin_content %}

<div class="container">

    <h2>Edit Customer</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="customer_name" class="form-control" value="{{ customer[1] }}">
        </div>

        <div class="mb-3">
            <label>Gender</label>
            <input type="text" name="gender" class="form-control" value="{{ customer[2] }}">
        </div>

        <div class="mb-3">
            <label>Mobile</label>
            <input type="text" name="mobile" class="form-control" value="{{ customer[3] }}">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ customer[4] }}">
        </div>

        <div class="mb-3">
            <label>Address</label>
            <input type="text" name="address" class="form-control" value="{{ customer[5] }}">
        </div>

        <div class="mb-3">
            <label>City</label>
            <input type="text" name="city" class="form-control" value="{{ customer[6] }}">
        </div>

        <div class="mb-3">
            <label>Check In Date</label>
            <input type="date" name="check_in_date" class="form-control" value="{{ customer[7] }}">
        </div>

        <button class="btn btn-success">
            Update Customer
        </button>

        <a href="/customers" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
